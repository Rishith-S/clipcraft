# Keeps the free tiers warm: Supabase pauses after 7 idle days, Upstash gets a
# daily self-expiring ping for good measure. Needs repo secrets:
# SUPABASE_DIRECT_URL (= DIRECT_URL), UPSTASH_REST_URL, UPSTASH_REST_TOKEN.
name: keepalive

on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC
  workflow_dispatch: # manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run SELECT 1 against Supabase
        run: |
          pip install -q psycopg2-binary
          python3 -c "
          import os, psycopg2
          from urllib.parse import urlparse, unquote
          u = urlparse(os.environ['DIRECT_URL'])
          c = psycopg2.connect(host=u.hostname, port=u.port or 5432, dbname=u.path.lstrip('/') or 'postgres', user=unquote(u.username or ''), password=unquote(u.password or ''))
          c.cursor().execute('SELECT 1')
          print('SUPABASE_OK')
          c.close()
          "
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

      - name: Ping Upstash (self-expiring key)
        run: |
          # strip accidental quotes/whitespace from the pasted secret, fail loudly if unset
          UPSTASH_URL=$(printf '%s' "$UPSTASH_URL" | tr -d ' \t\r\n"')
          : "${UPSTASH_URL:?UPSTASH_REST_URL secret is missing or empty}"
          : "${UPSTASH_TOKEN:?UPSTASH_REST_TOKEN secret is missing or empty}"
          # safe diagnostic: length + scheme only, value stays masked
          case "$UPSTASH_URL" in https://*.upstash.io) echo "url looks sane (len ${#UPSTASH_URL})";; *) echo "URL_NOPE len=${#UPSTASH_URL}";; esac
          curl -sS -H "Authorization: Bearer $UPSTASH_TOKEN" "$UPSTASH_URL/set/keepalive_probe/$(date +%F) EX 86400" && echo " <- UPSTASH_OK"
        env:
          UPSTASH_URL: ${{ secrets.UPSTASH_REST_URL }}
          UPSTASH_TOKEN: ${{ secrets.UPSTASH_REST_TOKEN }}
