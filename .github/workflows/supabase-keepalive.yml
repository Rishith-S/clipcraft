# Keeps the free Supabase project from pausing (pauses after 7 days idle).
# Runs one real query a day. Needs repo secret SUPABASE_DIRECT_URL (= DIRECT_URL).
name: supabase-keepalive

on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC
  workflow_dispatch: # manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run SELECT 1 against Supabase
        run: |
          pip install -q psycopg2-binary
          python3 -c "import psycopg2, os; c = psycopg2.connect(os.environ['DIRECT_URL']); c.cursor().execute('SELECT 1'); print('SUPABASE_OK'); c.close()"
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
